name: Weekly Link Check

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9 AM UTC
  workflow_dispatch:

jobs:

  check-html-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check live site links
        uses: lycheeverse/lychee-action@v1
        with:
          args: >
            --verbose
            --no-progress
            --accept 200,201,204,206,429
            --timeout 20
            --max-retries 3
            --exclude "kit-iai-dracos.github.io/#"
            --exclude "powerbi.com"
            --exclude "osf.io"
            https://kit-iai-dracos.github.io/PGF_IAI/
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check-osf-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check OSF links for soft 404s
        run: |
          grep -rhoP 'https://osf\.io/[^\s"<>]+' . \
            --include="*.html" \
            --include="*.md" \
            --include="*.json" \
            --include="*.yml" \
            | sort -u > /tmp/osf-links.txt

          echo "Found OSF links:"
          cat /tmp/osf-links.txt
          BROKEN=0

          while IFS= read -r url; do
            BODY=$(curl -s --max-time 20 "$url")
            if echo "$BODY" | grep -qiE '"title"\s*:\s*"OSF"' && \
               ! echo "$BODY" | grep -qiE 'files|project|component|preprint'; then
              echo "❌ SOFT 404: $url"
              BROKEN=1
            else
              echo "✅ OK: $url"
            fi
          done < /tmp/osf-links.txt

          exit $BROKEN

  report:
    runs-on: ubuntu-latest
    needs: [check-html-links, check-osf-links]
    if: failure()
    steps:
      - name: Create Issue
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🔗 Broken links detected — ${{ github.run_id }}"
          content-filepath: ./lychee/out.md
          labels: broken-links, automated
