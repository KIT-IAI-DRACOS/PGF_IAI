name: Weekly Link Check

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9 AM UTC
  workflow_dispatch:

jobs:

  check-html-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check live site links
        uses: lycheeverse/lychee-action@v1
        with:
          args: >
            --verbose
            --no-progress
            --accept 200,201,204,206,429
            --timeout 20
            --max-retries 3
            --exclude "kit-iai-dracos.github.io/#"
            --exclude "powerbi.com"
            --exclude "osf.io"
            https://kit-iai-dracos.github.io/PGF_IAI/
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload lychee report
        if: always()   # run even if previous step failed
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: ./lychee/out.md
          
  check-osf-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check OSF links via API
        run: |
          grep -rhoP 'https://osf\.io/([a-z0-9]+)' . \
            --include="*.html" \
            --include="*.md" \
            --include="*.json" \
            --include="*.yml" \
            | sed 's|https://osf\.io/||' \
            | grep -vE '^(download|files|osfstorage)$' \
            | sort -u > /tmp/osf-guids.txt
      
          echo "Found OSF GUIDs:"
          cat /tmp/osf-guids.txt
          BROKEN=0
      
          while IFS= read -r guid; do
            API_URL="https://api.osf.io/v2/guids/${guid}/"
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$API_URL")
      
            if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "302" ]; then
              echo "✅ OK: https://osf.io/$guid → API $HTTP_STATUS"
            else
              echo "❌ BROKEN: https://osf.io/$guid → API $HTTP_STATUS"
              BROKEN=1
            fi
          done < /tmp/osf-guids.txt
      
          exit $BROKEN

      - name: Save OSF report
        if: always()
        run: |
            echo "## OSF Link Check Results" > /tmp/osf-report.md
            echo "Run: ${{ github.run_id }}" >> /tmp/osf-report.md
  
      - name: Upload OSF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
            name: osf-report
            path: /tmp/osf-report.md

  report:
    runs-on: ubuntu-latest
    needs: [check-html-links, check-osf-links]
    if: failure()
    steps:
      - name: Download lychee report
        uses: actions/download-artifact@v4
        with:
          name: lychee-report
        continue-on-error: true   # in case html job passed and no report exists

      - name: Create failure report
        run: |
          echo "## 🔗 Broken Links Detected" > ./report.md
          echo "**Run ID:** ${{ github.run_id }}" >> ./report.md
          echo "**Run URL:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> ./report.md
          echo "" >> ./report.md
          if [ -f ./out.md ]; then
            echo "### HTML Link Check Report" >> ./report.md
            cat ./out.md >> ./report.md
          fi

      - name: Create Issue
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🔗 Broken links detected — ${{ github.run_id }}"
          content-filepath: ./report.md
          labels: broken-links, automated
