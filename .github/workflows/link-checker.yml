name: Weekly Link Check
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  check-html-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check live site links
        uses: lycheeverse/lychee-action@v1
        with:
          args: >
            --verbose
            --no-progress
            --accept 200,201,204,206,429
            --timeout 20
            --max-retries 3
            --exclude "kit-iai-dracos.github.io/#"
            --exclude "powerbi.com"
            --exclude "osf.io"
            https://kit-iai-dracos.github.io/PGF_IAI/
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload lychee report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: ./lychee/out.md       

  check-osf-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check OSF links via API
        run: |
          grep -rhoP 'https://osf\.io/([a-z0-9]+)' . \
            --include="*.html" \
            --include="*.md" \
            --include="*.json" \
            --include="*.yml" \
            | sed 's|https://osf\.io/||' \
            | grep -vE '^(download|files|osfstorage|preprints|registrations|meetings|search|profile|settings|support|explore|institutions|login|logout|register|project|components)$' \
            | sort -u > /tmp/osf-guids.txt

          echo "Found OSF GUIDs:"
          cat /tmp/osf-guids.txt
          BROKEN=0

          while IFS= read -r guid; do
            API_URL="https://api.osf.io/v2/guids/${guid}/"
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 20 "$API_URL")
            #                                                      ^^
            #                                 CHANGE 1: added -L to follow redirects

            if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "302" ]; then
              echo "✅ OK: https://osf.io/$guid → API $HTTP_STATUS"
            else
              echo "❌ BROKEN: https://osf.io/$guid → API $HTTP_STATUS"
              BROKEN=1
            fi
          done < /tmp/osf-guids.txt

          exit $BROKEN

      - name: Save OSF report
        if: always()
        run: |
          mkdir -p ./lychee
          #^^^^^^^^^
          # CHANGE 2: create ./lychee folder first, it doesn't exist on this machine
          
          echo "## OSF Link Check Results" > ./lychee/osf-report.md
          # CHANGE 3: write to ./lychee/osf-report.md not /tmp/osf-report.md
          #           so it matches the upload path below
          
          echo "Run: ${{ github.run_id }}" >> ./lychee/osf-report.md

      - name: Upload OSF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osf-report
          path: ./lychee/osf-report.md  

  report:
    runs-on: ubuntu-latest
    needs: [check-html-links, check-osf-links]
    if: failure()
    steps:
      - name: Download lychee report
        uses: actions/download-artifact@v4
        with:
          name: lychee-report
          path: ./reports/            
        continue-on-error: true

      - name: Download OSF report
        uses: actions/download-artifact@v4
        with:
          name: osf-report
          path: ./reports/             
        continue-on-error: true
       
      - name: Create failure report
        run: |
          echo "## 🔗 Broken Links Detected" > ./report.md
          echo "**Run URL:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> ./report.md
          echo "" >> ./report.md

          for f in ./reports/*; do
          # CHANGE 6: loop over all files in ./reports/ instead of hardcoding out.md
            if [ -f "$f" ]; then
              echo "### $(basename $f)" >> ./report.md
              cat "$f" >> ./report.md
              echo "" >> ./report.md
            fi
          done

      - name: Create and Assign Issue
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🔗 Broken links detected — ${{ github.run_id }}"
          content-filepath: ./report.md
          labels: broken-links, automated
          assignees: HallahButt   # GitHub users get notified via GitHub
      
      - name: Send Email to Full Team
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: hallah.butt@kit.edu         
          from: "PGF Link Checker <noreply@kit.edu>"
          subject: "🔗 Broken links detected in PGF_IAI"
          body: |
            Broken links were detected in the PGF_IAI website.
            
            View full report:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
